<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container">
    <div class="card shadow rounded-4 border-0">
      <div class="card-body p-4">
        

        <hr class="text-muted opacity-25">

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light text-secondary">
              <tr>
                <th scope="col" class="py-3">Matrícula</th>
                <th scope="col" class="py-3">Nombre Completo</th>
                <th scope="col" class="py-3">Carrera / Grado</th>
                <th scope="col" class="py-3">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                    <td class="fw-bold">ALU-202601</td>
                    <td>Megan Ariadna</td>
                    <td>Ingeniería en Sistemas</td>
                    <td>
                        <div class="btn-group btn-group-sm">
                        <button type="button" class="btn text-primary btn-editar" 
                                data-bs-toggle="modal" 
                                data-bs-target="#modalEditar"
                                data-id="ALU-202601" 
                                data-nombre="Megan Ariadna 
                                data-carrera="Ingeniería en Sistemas">
                            <i class="far fa-edit fs-5"></i>
                        </button>
                        
                        <button type="button" class="btn text-danger btn-borrar" data-id="ALU-202601">
                            <i class="far fa-trash-alt fs-5"></i>
                        </button>
                        </div>
                    </td>
                    </tr>



                    <tr>
                    <td class="fw-bold">ALU-202601</td>
                    <td>Ana Martínez López</td>
                    <td>Ingeniería en Sistemas</td>
                    <td>
                        <div class="btn-group btn-group-sm">
                        <button type="button" class="btn text-primary btn-editar" 
                                data-bs-toggle="modal" 
                                data-bs-target="#modalEditar"
                                data-id="ALU-202601" 
                                data-nombre="Ana Martínez López" 
                                data-carrera="Ingeniería en Sistemas">
                            <i class="far fa-edit fs-5"></i>
                        </button>
                        
                        <button type="button" class="btn text-danger btn-borrar" data-id="ALU-202601">
                            <i class="far fa-trash-alt fs-5"></i>
                        </button>
                        </div>
                    </td>
                    </tr>
            </tbody>
          </table>
      </div>
    </div>
  </div>
  
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEditarLabel">Editar Alumno</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formEditar">
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          
          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="edit-nombre" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Carrera</label>
            <input type="text" class="form-control" id="edit-carrera" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
